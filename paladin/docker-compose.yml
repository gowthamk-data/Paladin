name: paladin

# Bounded docker log files: without this the json-file driver grows without limit and can fill
# the disk of a small VM (Ollama and uvicorn are both chatty).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  paladin-api:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: paladin-paladin-api:latest
    restart: unless-stopped
    ports: ["8000:8000"]
    environment:
      # Fail fast (and loudly) if .env is missing instead of starting with an empty password.
      - DATABASE_URL=postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/paladin
      - JWT_PRIVATE_KEY_PATH=/app/keys/private.pem
      - JWT_PUBLIC_KEY_PATH=/app/keys/public.pem
      - JWT_ALGORITHM=${JWT_ALGORITHM:-RS256}
      - JWT_EXPIRY_MINUTES=${JWT_EXPIRY_MINUTES:-30}
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - OLLAMA_TIMEOUT_SECONDS=${OLLAMA_TIMEOUT_SECONDS:-300}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-10}
      - RATE_LIMIT_BURST=${RATE_LIMIT_BURST:-20}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-384}
      - MAX_PROMPT_CHARS=${MAX_PROMPT_CHARS:-8000}
      - MAX_REQUEST_BYTES=${MAX_REQUEST_BYTES:-32000}
      - SENTENCE_TRANSFORMERS_HOME=/app/.cache/sentence_transformers
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # Read-only: the gateway only ever reads the signing key pair, and a compromised gateway
      # must not be able to rotate or exfiltrate the private key.
      - ./keys:/app/keys:ro
      # ~760 MB of embedding-model artefacts: keep them across container rebuilds.
      - sentence_transformers_cache:/app/.cache/sentence_transformers
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      # Not service_healthy: the gateway degrades to a 503 on /ask when the LLM is down, so
      # there is no reason to hold the API (and therefore the UI) hostage to Ollama's slow boot.
      ollama:
        condition: service_started
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging
    # NOTE: `deploy.resources` is honored only by `docker stack deploy` (Swarm) and is
    # IGNORED by plain `docker compose up`. The mem_limit/mem_reservation/cpus fields
    # below are the ones the Docker engine actually enforces for `docker compose up`,
    # which is how this stack is deployed on OCI. Both blocks are kept identical so the
    # two deployment modes behave the same.
    mem_limit: 2G
    mem_reservation: 512M
    cpus: "2.0"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 512M

  # Run explicitly for user provisioning. Keeping seeding credentials out of
  # the long-lived API container limits their lifetime to this one-off task.
  paladin-seeder:
    image: paladin-paladin-api:latest
    profiles: ["operations"]
    entrypoint: ["python", "-m", "gateway.db.seed"]
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/paladin
      - PALADIN_ENV=${PALADIN_ENV:-}
      - PALADIN_SEED_EMP1_PASSWORD=${PALADIN_SEED_EMP1_PASSWORD:-}
      - PALADIN_SEED_EMP1_PASSWORD_FILE=${PALADIN_SEED_EMP1_PASSWORD_FILE:-}
      - PALADIN_SEED_MGR1_PASSWORD=${PALADIN_SEED_MGR1_PASSWORD:-}
      - PALADIN_SEED_MGR1_PASSWORD_FILE=${PALADIN_SEED_MGR1_PASSWORD_FILE:-}
      - PALADIN_SEED_ADMIN1_PASSWORD=${PALADIN_SEED_ADMIN1_PASSWORD:-}
      - PALADIN_SEED_ADMIN1_PASSWORD_FILE=${PALADIN_SEED_ADMIN1_PASSWORD_FILE:-}
      - PALADIN_SEED_FIN1_PASSWORD=${PALADIN_SEED_FIN1_PASSWORD:-}
      - PALADIN_SEED_FIN1_PASSWORD_FILE=${PALADIN_SEED_FIN1_PASSWORD_FILE:-}
    networks: [internal]

  paladin-ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    image: paladin-paladin-ui:latest
    restart: unless-stopped
    ports: ["8501:8501"]
    environment:
      - API_URL=http://paladin-api:8000
      - PYTHONPATH=/app
    depends_on:
      paladin-api:
        condition: service_healthy
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging
    # Enforced by plain `docker compose up` (deploy.resources is Swarm-only); kept
    # identical to the deploy block below.
    mem_limit: 512M
    mem_reservation: 128M
    cpus: "1.0"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  postgres:
    # Pinned to the exact minor version the audit trail was verified against.
    image: postgres:16.15
    restart: unless-stopped
    # Sized for the smallest supported deployment. The previous shared_buffers=1GB assumed more
    # memory than an OCI Always Free VM has in total.
    command: >
      -c shared_buffers=128MB
      -c work_mem=16MB
      -c max_connections=50
    environment:
      POSTGRES_DB: paladin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paladin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging
    # Enforced by plain `docker compose up` (deploy.resources is Swarm-only); kept
    # identical to the deploy block below.
    mem_limit: 512M
    cpus: "1.0"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  chromadb:
    image: chromadb/chroma:0.4.24
    restart: unless-stopped
    environment:
      # PERSIST_DIRECTORY is the variable chromadb 0.4.x actually reads, and /chroma/chroma is
      # where the 0.4.24 image stores collections by default. The previous
      # CHROMA_COLLECTION_PERSIST_DIRECTORY / IS_PERSISTENT pair were 0.3.x leftovers that were
      # silently ignored, which is why the named volume below never held any data and the
      # ingested documents lived only in the container's writable layer.
      - PERSIST_DIRECTORY=/chroma/chroma
    volumes:
      - chromadb_data:/chroma/chroma
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://127.0.0.1:8000/api/v1/heartbeat\", timeout=5).status == 200 else 1)'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging
    # Enforced by plain `docker compose up` (deploy.resources is Swarm-only); kept
    # identical to the deploy block below.
    mem_limit: 1G
    mem_reservation: 256M
    cpus: "1.0"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.1"
          memory: 256M

  ollama:
    image: ollama/ollama:0.34.2
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-4096}
      # Single CPU inference slot: there is no GPU in this deployment, so parallel requests
      # would only queue behind each other while multiplying resident memory.
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-10m}
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging
    # Enforced by plain `docker compose up` (deploy.resources is Swarm-only); kept
    # identical to the deploy block below. Ollama holds the 8G memory share of the
    # 12 GB A1 budget but is capped at 2.0 CPUs so it cannot exceed the 2-OCPU shape.
    mem_limit: 8G
    mem_reservation: 1G
    cpus: "2.0"
    deploy:
      # Sized against the standard OCI Always Free Ampere A1 budget (2 OCPUs /
      # 12 GB RAM per tenancy): llama3:8b needs ~4.7 GB resident before context,
      # so this cap reserves the LLM's share while api (2G) + chroma (1G) +
      # postgres (512M) + ui (512M) plus ~1-2 GB OS/Docker overhead fit the rest.
      # Larger allocations only apply with an explicit OCI entitlement.
      resources:
        limits:
          cpus: "2.0"
          memory: 8G
        reservations:
          cpus: "0.5"
          memory: 1G

networks:
  # Single private bridge: postgres, chromadb and ollama publish no ports and are reachable only
  # by the other containers on this network.
  internal:
    driver: bridge

volumes:
  pgdata:
  # Was mounted at /chroma/data, where chromadb never wrote anything; now at the real path.
  chromadb_data:
  ollama_data:
  sentence_transformers_cache:
